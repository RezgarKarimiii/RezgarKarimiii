<form method="POST" action="/register">
    <input type="text" name="full_name" placeholder="نام و نام خانوادگی" required />
    <input type="text" name="phone_number" placeholder="شماره موبایل" required />
    <input type="password" name="password" placeholder="رمز عبور" required />
    <input type="password" name="confirm_password" placeholder="تأیید رمز عبور" required />
    
    <hr />
  
    <input type="text" name="province" placeholder="استان" required />
    <input type="text" name="city" placeholder="شهر" required />
    <textarea name="full_address" placeholder="آدرس کامل" required></textarea>
    <input type="text" name="postal_code" placeholder="کد پستی (اختیاری)" />
    <input type="text" name="extra_note" placeholder="توضیحات برای پیک" />
  
    <button type="submit">ثبت‌نام</button>
  </form>
